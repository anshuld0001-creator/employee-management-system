{% extends "mainapp/base.html" %}
{% block title %}Edit Employee{% endblock %}
{% block content %}
<div class="card">
  <h1>✏️Edit Employee</h1>

  {% if errors %}
  <div class="errors">
    <ul>
      {% for error in errors %}
      <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ employee.name }}">
    </div>

    <div class="field">
      <label for="designation">Designation</label>
      <input type="text" id="designation" name="designation" value="{{ employee.designation }}">
    </div>

    <div class="field">
      <label for="salary">Salary</label>
      <input type="text" id="salary" name="salary" value="{{ employee.salary }}">
    </div>

    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="4">{{ employee.address }}</textarea>
    </div>

    <div class="field">
      <label for="picture">Profile Picture</label>
      {% if employee.picture %}
        <div style="margin-bottom:10px;">
          <img src="{{ employee.picture.url }}" class="pic-thumb" alt="{{ employee.name }}">
        </div>
      {% endif %}
      <input type="file" id="picture" name="pic" accept="image/*">
    </div>

    <button type="submit" class="btn">Save Changes</button>
  </form>
</div>
{% endblock %}
